# Hält das kostenlose Supabase-Projekt wach (es pausiert nach 7 Tagen ohne Anfragen).
name: Supabase wach halten
on:
  schedule:
    - cron: '17 6 * * 1,4'   # montags und donnerstags, 06:17 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Kleine Anfrage an die Datenbank
        env:
          URL: ${{ vars.SUPABASE_URL || 'https://umkmccwdfondjlvglswj.supabase.co' }}
          KEY: ${{ vars.SUPABASE_ANON_KEY || 'sb_publishable_ldK6Y_pO1dooil6HhEpHzA_Rzg_coU0' }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "apikey: $KEY" -H "x-group-code: KEEPALIVE" "$URL/rest/v1/reviews?select=id&limit=1")
          echo "Supabase antwortet mit HTTP $code"
          test "$code" = "200"
